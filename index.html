<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>pomodoro</title>
        <link rel = "stylesheet" href = "styles.css">
        <script src = "apps.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
        <link rel="icon" type="image/png" href="caticon.jpg">
    </head>
    <body>
        <div class = "clockHolder">
            <h2 id = "dateElement"></h2>
            <h2 id = "timeElement"></h2>
            
            <div class = "modeButtons" role = "group" aria-label = "Timer mode">
                <button class = "modeButton active" data-mode = "focus" type = "button" id="focusButton">Focus</button>
                <button class = "modeButton" data-mode = "shortBreak" type = "button" id="shortButton">Short break</button>
                <button class = "modeButton" data-mode = "longBreak" type = "button" id="longButton">Long break</button>
            </div>
            <h1 id = "countdownTimer" aria-live = "polite">25:00</h1>
            <div class = "progressTrack" aria-hidden = "true">
                <div id = "progressBar" class = "progressBar"></div>
            </div>
            <p id = "timerStatus" class = "timerStatus">Ready to focus</p>
            <div class = "timerActions">
                <button id = "bigButton" type = "button">Start</button>
                <button id = "resetButton" type = "button">Reset</button>
            </div>
            <p id = "sessionCount" class = "sessionCount">0 focus sessions completed</p>
        </div>

        <details class = "soundControls">
            <summary>Background Sounds</summary>
            <div class = "soundMenu" aria-label = "Background sound mixer">
                <div class = "soundRow">
                    <span>White Noise</span>
                    <button class = "sound-button" data-sound = "white" type = "button" aria-pressed = "false">Play</button>
                    <label class = "volumeControl">
                        <span class = "sr-only">White Noise volume</span>
                        <input class = "volumeSlider" data-sound = "white" type = "range" min = "0" max = "1" step = "0.01" value = "0.5">
                    </label>
                </div>
                <div class = "soundRow">
                    <span>Brown Noise</span>
                    <button class = "sound-button" data-sound = "brown" type = "button" aria-pressed = "false">Play</button>
                    <label class = "volumeControl">
                        <span class = "sr-only">Brown Noise volume</span>
                        <input class = "volumeSlider" data-sound = "brown" type = "range" min = "0" max = "1" step = "0.01" value = "0.5">
                    </label>
                </div>
            </div>
        </details>
        </div>

        <audio id = "whiteNoiseAudio" loop>
            <source src = "02-White-Noise-60min.mp3" type = "audio/mpeg">
            your browser does not support the audio element
        </audio>

        <audio id = "brownNoiseAudio" loop>
            <source src = "Brown Noise.mp3" type = "audio/mpeg">
            your browser does not support the audio element
        </audio>

    </body>
</html>
